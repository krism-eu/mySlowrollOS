name: atomic-update 5.7 checks

on:
  push:
    branches:
      - main
      - work/myslowroll-rifiniture-20261009
    paths:
      - 'atomic-update/**'
      - 'agama/**'
      - 'core/**'
      - 'obs/criscore1/**'
      - 'myslowroll-workstation/**'
      - '.github/workflows/atomic-update-57-check.yml'
  pull_request:
    paths:
      - 'atomic-update/**'
      - 'agama/**'
      - 'core/**'
      - 'obs/criscore1/**'
      - 'myslowroll-workstation/**'
      - '.github/workflows/atomic-update-57-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run these before the revision-pin check: intermediate work-branch
      # commits intentionally defer asset/profile regeneration until final review.
      - name: Early shell syntax and firstboot self-test
        shell: bash
        run: |
          set -euo pipefail
          for script in atomic-update/atomic-update-5.7.1.sh agama/*.sh agama/tests/*.sh; do
            bash -n "$script"
          done
          test "$(grep -Fc 'exit "$firstboot_rc"' agama/init-firstboot.sh)" -eq 1
          bash agama/init-firstboot.sh --self-test
          bash agama/post-chroot-boot-policy.sh --self-test
      - name: Verify pinned installer assets match working tree
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat agama/assets-revision)"
          git cat-file -e "${revision}^{commit}"
          git diff --exit-code "$revision" HEAD -- myslowroll-policy ':(glob)agama/*.sh' agama/keys
      - name: Check generated core and Agama profiles
        run: |
          python3 core/generate-criscore-spec.py --check
          python3 agama/generate-profiles.py --check
      - name: Bash syntax
        run: bash -n atomic-update/atomic-update-5.7.1.sh
      - name: Agama cmdline and YaST functional regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n agama/init-firstboot.sh
          bash -n agama/post-chroot-boot-policy.sh
          bash agama/init-firstboot.sh --self-test
          # Expected next-installation policies (not a runtime VM test).
          for unit in btrfs-balance.timer btrfs-defrag.timer btrfs-trim.timer; do
            grep -Fxq "disable $unit" myslowroll-policy/10-myslowroll.preset
          done
          # Storage/RAID/LVM/NVMe-oF units must be managed after checking
          # actual target layout, not disabled unconditionally in presets.
          for unit in \
              mdcheck_start.timer mdcheck_continue.timer mdmonitor-oneshot.timer \
              lvm2-monitor.service blk-availability.service \
              nvmefc-boot-connections.service nvmf-autoconnect.service; do
            ! grep -Fxq "disable $unit" myslowroll-policy/10-myslowroll.preset
          done
          grep -Fq 'for unit in mdcheck_start.timer mdcheck_continue.timer mdmonitor-oneshot.timer; do' agama/init-firstboot.sh
          for unit in lvm2-monitor.service blk-availability.service \
                      nvmefc-boot-connections.service nvmf-autoconnect.service; do
            grep -Fq "disable_optional_unit $unit" agama/init-firstboot.sh
          done
          grep -Fxq 'enable btrfs-scrub.timer' myslowroll-policy/10-myslowroll.preset
          grep -Fxq 'enable fstrim.timer' myslowroll-policy/10-myslowroll.preset
          # Agama post-chroot edits installer-created Snapper config.
          # Firstboot must validate, never rewrite or clean snapshots.
          bash agama/post-chroot-boot-policy.sh --self-test
          grep -Fq 'NUMBER_LIMIT="4-4"' agama/post-chroot-boot-policy.sh
          grep -Fq 'NUMBER_LIMIT_IMPORTANT="0-0"' agama/post-chroot-boot-policy.sh
          grep -Fq 'NUMBER_MIN_AGE="3600"' agama/post-chroot-boot-policy.sh
          grep -Fq 'TIMELINE_CREATE="no"' agama/post-chroot-boot-policy.sh
          grep -Fq "NUMBER_LIMIT=\"4-4\"" agama/init-firstboot.sh
          grep -Fq "NUMBER_LIMIT_IMPORTANT=\"0-0\"" agama/init-firstboot.sh
          ! grep -Eq '(snapper .*(set-config|cleanup (number|all))|NUMBER_LIMIT="4-8")' agama/init-firstboot.sh
          grep -Fxq 'Hidden=true' myslowroll-policy/backintime-autostart-disabled.desktop
          grep -Fxq 'WirelessEnabled=false' myslowroll-policy/NetworkManager.state
          grep -Fxq 'AutoEnable=false' myslowroll-policy/90-myslowroll-bluez.conf
          grep -Fq 'bluetoothctl --timeout 5 power off' agama/init-firstboot.sh
          grep -Fq 'nmcli radio wifi off' agama/init-firstboot.sh
          python3 - <<'PY'
          import json
          p = json.load(open('agama/profile-policy.json'))
          f = {x['destination']: x['source'] for x in p['files']}
          assert f['/etc/xdg/autostart/backintime.desktop'] == \
              'myslowroll-policy/backintime-autostart-disabled.desktop'
          assert f['/etc/skel/.config/autostart/backintime.desktop'] == \
              'myslowroll-policy/backintime-autostart-disabled.desktop'
          assert not any(k in p for k in ('storage', 'user', 'root'))
          print('PASS: no new background services and package-independent XDG autostart suppression')
          PY
          bash agama/post-chroot-boot-policy.sh --self-test
          python3 - <<'PY'
          import json
          p = json.load(open('agama/profile-policy.json'))
          files = {f['destination']: f['source'] for f in p['files']}
          expected = {
              '/etc/bluetooth/main.conf': 'myslowroll-policy/90-myslowroll-bluez.conf',
              '/etc/xdg/kcminputrc': 'myslowroll-policy/kcminputrc',
              '/usr/share/sddm/themes/breeze/theme.conf.user': 'myslowroll-policy/90-myslowroll-sddm-theme.conf',
              '/var/lib/NetworkManager/NetworkManager.state': 'myslowroll-policy/NetworkManager.state'
          }
          assert all(files.get(k) == v for k, v in expected.items()), files
          assert 'AutoEnable=false' in open(expected['/etc/bluetooth/main.conf']).read()
          assert 'WirelessEnabled=false' in open(expected['/var/lib/NetworkManager/NetworkManager.state']).read()
          assert 'NumLock=0' in open(expected['/etc/xdg/kcminputrc']).read()
          assert 'type=color' in open(expected['/usr/share/sddm/themes/breeze/theme.conf.user']).read()
          assert not any(k in p for k in ('storage','user','root'))
          print('PASS: first-boot radio/greeter policies and interactive storage')
          PY
          grep -Fxq 'rw security=apparmor systemd.show_status=1 quiet' myslowroll-policy/kernel-cmdline
          grep -Fxq 'libyui-qt-pkg16' agama/install-only-packages.txt
          grep -Fxq 'xauth' agama/install-only-packages.txt
          grep -Fxq 'Requires:       plymouth' myslowroll-workstation/myslowroll-workstation.spec
          ! grep -Eq '^Requires:[[:space:]]+plymouth([[:space:]]|$)' obs/criscore1/criscore1.spec
          grep -Fq '"extraKernelParams": "security=apparmor systemd.show_status=1"' agama/profile-policy.json
          ! grep -Eq '^Requires:[[:space:]]+xauth([[:space:]]|$)' myslowroll-workstation/myslowroll-workstation.spec obs/criscore1/criscore1.spec
      - name: Mocked recovery regression tests
        run: |
          bash atomic-update/tests/ci-regression.sh
          bash atomic-update/tests/recovery-review.sh
      - name: Single-version source and paths
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find atomic-update -maxdepth 1 -type f -name 'atomic-update-*.sh' -printf '%f\n')"
          test "$source_file" = 'atomic-update-5.7.1.sh'
          grep -Fq "readonly STATE_VERSION=1" atomic-update/atomic-update-5.7.1.sh
          grep -Fq "readonly STATE_DIR=/var/lib/myslowroll/atomic-update" atomic-update/atomic-update-5.7.1.sh
          ! grep -Eq 'atomic-dup-v[0-9]|myslowroll-v[0-9]' atomic-update/atomic-update-5.7.1.sh
      - name: Static design invariants
        shell: bash
        run: |
          set -euo pipefail
          f=atomic-update/atomic-update-5.7.1.sh
          grep -Fq "PROGRAM_VERSION='5.7.1-guarded'" "$f"
          grep -Fq 'STATE_SOURCE_FINGERPRINT=' "$f"
          grep -Fq 'PLAN_XML_PREPARED=' "$f"
          grep -Fq 'PLAN_XML_REVALIDATED=' "$f"
          ! grep -Fq 'PLAN_XML_B=' "$f"
          ! grep -Fq 'etc_tree_hash()' "$f"
          ! grep -Fq 'STATE_TOOLCHAIN_HASH=' "$f"
          grep -Fq 'planning planned revalidated opening target verified committing' "$f"
          grep -Fq 'STATE_STATUS=revalidated' "$f"
          grep -Fq 'STATE_STATUS=needs-inspection' "$f"
          grep -Fq 'recover_typed_abort()' "$f"
          grep -Fq 'target_quiescent()' "$f"
