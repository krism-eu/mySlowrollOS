id: mySlowrollOS
name: mySlowrollOS
archs: x86_64
description: 'Personal openSUSE Slowroll Plasma Wayland workstation with Btrfs,
  Snapper, systemd-boot and guarded offline updates.'
desktop_selection: optional

software:
  installation_repositories:
    - url: https://download.opensuse.org/slowroll/repo/oss/
      archs: x86_64
    - url: https://download.opensuse.org/slowroll/repo/non-oss/
      archs: x86_64
    - url: https://download.opensuse.org/update/slowroll/repo/oss/
      archs: x86_64
    - url: https://download.opensuse.org/repositories/home:/krism/openSUSE_Slowroll/
      archs: x86_64

  mandatory_patterns:
    - enhanced_base
  optional_patterns: []
  user_patterns: []

  mandatory_packages:
    - NetworkManager
    - openSUSE-repos-Slowroll
    - sudo-policy-wheel-auth-self
    - myslowroll-workstation
    - myslowroll-policy
  optional_packages: []
  base_product: openSUSE

boot:
  default_efi_bootloader: "systemd-boot"

# Product storage defines only supported filesystems/layout capabilities.
# SAFE DEFAULT: never delete or resize existing storage automatically.
# No target disk is preselected and no unattended storage profile is loaded.
# Disk selection, partition creation/reuse, formatting and mount assignments
# are all explicit manual choices in the Agama UI.
storage:
  space_policy: keep
  volumes:
    - "/"
    - "swap"
  volume_templates:
    - mount_path: "/"
      filesystem: btrfs
      btrfs:
        snapshots: true
        read_only: false
        default_subvolume: "0"
        subvolumes:
          - path: home
          - path: var
            copy_on_write: false
      size:
        auto: true
      outline:
        required: true
        filesystems:
          - btrfs
        auto_size:
          base_min: 5 GiB
          base_max: 15 GiB
          snapshots_increment: 250%
          max_fallback_for:
            - "/home"
        snapshots_configurable: true

    - mount_path: "swap"
      filesystem: swap
      size:
        min: 1 GiB
        max: 2 GiB
      outline:
        required: false
        filesystems:
          - swap

    - mount_path: "/home"
      filesystem: btrfs
      size:
        auto: false
        min: 5 GiB
        max: unlimited
      outline:
        required: false
        filesystems:
          - btrfs
          - ext4
          - xfs

    - filesystem: vfat
      size:
        auto: false
        min: 512 MiB
      outline:
        required: false
        filesystems:
          - vfat
